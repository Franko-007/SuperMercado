<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compra SuperMercado</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Carrito">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/brzcJNRF/Whats-App-Image-2026-03-07-at-13-14-51.jpg">

    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/brzcJNRF/Whats-App-Image-2026-03-07-at-13-14-51.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css?v=101">
</head>
<body>
    <div id="root"></div>

    <script>
        // Registro del Service Worker en JS plano, sin pasar por Babel —
        // así se activa de inmediato sin esperar a que se cargue/transpile
        // todo el bundle de React, y herramientas como PWABuilder lo detectan bien.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SmartCart: Modo Offline Activo', reg))
                    .catch(err => console.log('Error al activar modo offline', err));
            });
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    
    <script type="text/babel" data-presets="react" src="scripts.js?v=101"></script>
</body>
</html>
